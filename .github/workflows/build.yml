name: Compilar KeyShift (VST3 Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --target KeyShift_VST3 --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "KeyShift.vst3" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $vst.FullName dist/KeyShift.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: KeyShift-VST3-Windows
          path: dist/KeyShift.vst3

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/KeyShift.vst3 -DestinationPath KeyShift-VST3-Windows.zip

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: descarga
          name: KeyShift VST3 (Windows)
          files: KeyShift-VST3-Windows.zip
